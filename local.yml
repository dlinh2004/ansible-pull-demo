---
- name: Tự động cài đặt và cấu hình Nginx (Đã sửa lỗi font)
  hosts: localhost
  connection: local
  become: yes # Chạy với quyền root
  tasks:
    - name: Đảm bảo Nginx đã được cài đặt
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Đảm bảo Nginx đang chạy và tự bật khi khởi động
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Tạo trang web custom có hỗ trợ tiếng Việt (Fixed font)
      copy:
        dest: /var/www/html/index.html
        content: |
          <!DOCTYPE html>
          <html lang="vi">
          <head>
              <meta charset="UTF-8">
              <title>Ansible Pull Demo</title>
              <style>
                  body { font-family: sans-serif; text-align: center; margin-top: 50px; }
                  h1 { color: #2c3e50; }
              </style>
          </head>
          <body>
              <h1>✅ Triển khai thành công Ansible Pull!</h1>
              <p>Trạng thái: Zero Configuration.</p>
          </body>
          </html>
